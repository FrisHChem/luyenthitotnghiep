<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Luyện Đề Trực Tuyến</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 50px; }

        .top-navbar {
            background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 16px 40px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); margin-bottom: 30px;
        }
        .nav-brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 800; color: #2563eb; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-btn {
            background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 10px 20px;
            border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; text-decoration: none; transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active {
            background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .main-container { max-width: 1300px; margin: 0 auto; padding: 0 40px; }

        .stats-container {
            display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 20px; align-items: center; margin-bottom: 25px;
        }
        .stat-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px 24px;
            display: flex; align-items: center; gap: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .stat-icon {
            width: 48px; height: 48px; border-radius: 12px; background: rgba(37, 99, 235, 0.1);
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: #2563eb;
        }
        .stat-info .stat-value { font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .stat-info .stat-label { font-size: 13px; color: #64748b; font-weight: 500; }

        .filter-bar {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px 24px;
            display: flex; align-items: center; gap: 14px; margin-bottom: 35px; overflow-x: auto;
        }
        .filter-label { display: flex; align-items: center; gap: 8px; color: #0f172a; font-weight: 700; font-size: 15px; margin-right: 10px; white-space: nowrap; }
        .filter-btn {
            background: #f1f5f9; border: 1px solid #e2e8f0; color: #475569; padding: 10px 20px;
            border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover { background: #e2e8f0; }
        .filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }

        .exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 30px; }
        .exam-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; overflow: hidden;
            display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .exam-card:hover { transform: translateY(-5px); border-color: #cbd5e1; box-shadow: 0 15px 35px rgba(0,0,0,0.08); }

        .exam-banner {
            height: 160px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            position: relative; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end;
        }
        .banner-title { font-size: 24px; font-weight: 800; color: #ffffff; font-family: 'Georgia', serif; }
        .banner-subtitle { font-size: 12px; color: #e2e8f0; margin-top: 4px; }

        .exam-content { padding: 24px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1; }
        .exam-meta-top { display: flex; justify-content: space-between; align-items: center; }
        .subject-tag { background: rgba(37, 99, 235, 0.1); color: #2563eb; padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; }
        .exam-title { font-size: 18px; font-weight: 700; color: #0f172a; line-height: 1.4; }
        .exam-details-row { display: flex; gap: 20px; padding-top: 15px; border-top: 1px solid #f1f5f9; font-size: 13px; color: #64748b; }
        .exam-details-row b { color: #0f172a; }

        .btn-start-exam {
            width: 100%; background: #2563eb; color: white; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        .btn-start-exam:hover { background: #1d4ed8; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px);
            z-index: 9999; display: none; align-items: center; justify-content: center;
        }
        .modal-card {
            background: #ffffff; color: #0f172a; width: 560px; border-radius: 24px; padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; max-height: 90vh; overflow-y: auto;
        }
        .modal-title { font-size: 22px; font-weight: 800; color: #2563eb; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .modal-info-list { width: 100%; display: flex; flex-direction: column; gap: 14px; margin: 20px 0; text-align: left; }
        .modal-info-row { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .modal-info-label { color: #64748b; font-weight: 500; }
        .modal-info-val { color: #0f172a; font-weight: 700; }
        .btn-modal-action {
            width: 100%; background: #2563eb; color: white; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .btn-modal-action:hover { background: #1d4ed8; }
        .modal-link-back { display: block; text-align: center; color: #2563eb; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="nav-brand"><i class="fa-solid fa-graduation-cap"></i> Hệ Thống Ôn Thi THPT</div>
        <div class="nav-links">
            <a href="gochoctap.html" class="nav-btn"><i class="fa-solid fa-house"></i> Góc học tập</a>
            <a href="luyende.html" class="nav-btn active"><i class="fa-solid fa-pen-to-square"></i> Luyện đề</a>
        </div>
    </div>

    <div class="main-container">
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-pen-to-square"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-total-practiced">0</div>
                    <div class="stat-label">Đề thi đã luyện</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;"><i class="fa-solid fa-bullseye"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-avg-score">0.0 đ</div>
                    <div class="stat-label">Điểm trung bình</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;"><i class="fa-solid fa-bolt"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-strong-subject" style="font-size: 20px; margin-top: 2px;">Chưa có</div>
                    <div class="stat-label">Môn học thế mạnh</div>
                </div>
            </div>
            <button class="btn-start-exam" style="height: 88px; border-radius: 16px;" onclick="openCreateExamModal()">
                <i class="fa-solid fa-plus"></i> Tạo Phòng Thi Mới
            </button>
        </div>

        <div class="filter-bar">
            <div class="filter-label"><i class="fa-solid fa-filter" style="color: #2563eb;"></i> Bộ lọc:</div>
            <button class="filter-btn active" onclick="filterExams('all', this)">Tất cả</button>
            <button class="filter-btn" onclick="filterExams('Toán', this)">Toán</button>
            <button class="filter-btn" onclick="filterExams('Lý', this)">Lý</button>
            <button class="filter-btn" onclick="filterExams('Hóa', this)">Hóa</button>
        </div>

        <div class="exam-grid" id="exam-grid"></div>
    </div>

    <!-- Modal Xác nhận Bắt đầu thi -->
    <div id="confirm-modal-overlay" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <div class="modal-title" style="margin-bottom: 4px;">Bài Thi</div>
            <div style="font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 15px;">Xác nhận thông tin dự thi</div>
            <div class="modal-info-list">
                <div class="modal-info-row"><span class="modal-info-label">Họ tên</span><span class="modal-info-val">Nguyễn Bảo Ngọc</span></div>
                <div class="modal-info-row"><span class="modal-info-label">Kíp thi</span><span class="modal-info-val" id="modal-exam-name">...</span></div>
                <div class="modal-info-row"><span class="modal-info-label">Thời gian</span><span class="modal-info-val" id="modal-exam-time">...</span></div>
                <div class="modal-info-row"><span class="modal-info-label">Cấu trúc</span><span class="modal-info-val">Trắc nghiệm + Đúng/Sai + Trả lời ngắn</span></div>
            </div>
            <button class="btn-modal-action" onclick="confirmStartExam()"><i class="fa-solid fa-play"></i> Bắt đầu thi</button>
            <a class="modal-link-back" onclick="closeConfirmModal()"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
        </div>
    </div>

    <!-- Modal Tạo Phòng Thi Chuẩn Azota -->
    <div id="create-exam-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">Tạo Phòng Thi (Chuẩn Azota)</div>
            <div class="form-group">
                <label>Tên đề thi / Kíp thi</label>
                <input type="text" id="new-exam-name" class="form-control" placeholder="Ví dụ: Đề khảo sát chất lượng THPT">
            </div>
            <div class="form-group">
                <label>Môn học</label>
                <select id="new-exam-subject" class="form-control">
                    <option value="Toán">Toán</option>
                    <option value="Lý">Lý</option>
                    <option value="Hóa">Hóa</option>
                </select>
            </div>
            <div class="form-group">
                <label>Thời gian làm bài (phút)</label>
                <input type="number" id="new-exam-time" class="form-control" value="90" min="5" max="180">
            </div>
            <div class="form-group">
                <label>Link nhúng Google Drive (Xem đề)</label>
                <input type="text" id="new-exam-drive" class="form-control" placeholder="https://drive.google.com/file/d/.../preview">
            </div>
            <div class="form-group">
                <label>Đáp án Trắc nghiệm 4 lựa chọn (Ví dụ: A,B,C,D...)</label>
                <input type="text" id="new-exam-mcq" class="form-control" placeholder="A, B, C, D, A...">
            </div>
            <div class="form-group">
                <label>Đáp án Trả lời ngắn (Các kết quả phân cách bằng dấu phẩy)</label>
                <input type="text" id="new-exam-short" class="form-control" placeholder="25, 3.14, -2...">
            </div>
            <button class="btn-modal-action" onclick="saveNewExam()">Tạo đề thi</button>
            <a class="modal-link-back" onclick="closeCreateExamModal()">Hủy bỏ</a>
        </div>
    </div>

    <script>
        let selectedExamId = null;

        const defaultDatabase = {
            "exam_default": {
                id: "exam_default",
                name: "Khảo sát chất lượng THPT - Chuẩn 3 phần",
                subject: "Toán",
                time: 90,
                driveUrl: "https://drive.google.com/file/d/1_YOUR_GOOGLE_DRIVE_FILE_ID_HERE/preview",
                mcqAnswers: [0, 1, 2, 3], // A, B, C, D
                trueFalseAnswers: [
                    [true, false, true, true],
                    [false, true, true, false]
                ], // Phần II: Mỗi câu có 4 ý Đúng/Sai
                shortAnswers: ["25", "4"] // Phần III: Trả lời ngắn
            }
        };

        function getStoredDatabase() {
            let db = JSON.parse(localStorage.getItem('examDatabase'));
            if (!db) {
                db = defaultDatabase;
                localStorage.setItem('examDatabase', JSON.stringify(db));
            }
            return db;
        }

        function loadUserRealStats() {
            const history = JSON.parse(localStorage.getItem('examHistory')) || [];
            const totalPracticed = history.length;
            document.getElementById('stat-total-practiced').innerText = totalPracticed;

            if (totalPracticed > 0) {
                let totalScore = history.reduce((sum, item) => sum + parseFloat(item.score), 0);
                document.getElementById('stat-avg-score').innerText = (totalScore / totalPracticed).toFixed(2) + ' đ';

                let subjectScores = {}, subjectCounts = {};
                history.forEach(item => {
                    let sub = item.subject || 'Toán';
                    if (!subjectScores[sub]) { subjectScores[sub] = 0; subjectCounts[sub] = 0; }
                    subjectScores[sub] += parseFloat(item.score);
                    subjectCounts[sub] += 1;
                });

                let bestSubject = "Chưa có", highestAvg = -1;
                for (let sub in subjectScores) {
                    let subAvg = subjectScores[sub] / subjectCounts[sub];
                    if (subAvg > highestAvg) { highestAvg = subAvg; bestSubject = sub; }
                }
                document.getElementById('stat-strong-subject').innerText = bestSubject;
            } else {
                document.getElementById('stat-avg-score').innerText = '0.0 đ';
                document.getElementById('stat-strong-subject').innerText = 'Chưa có';
            }
        }

        function renderExamList() {
            const db = getStoredDatabase();
            const grid = document.getElementById('exam-grid');
            grid.innerHTML = '';

            for (let key in db) {
                const exam = db[key];
                grid.innerHTML += `
                    <div class="exam-card" data-subject="${exam.subject || 'Toán'}">
                        <div class="exam-banner">
                            <div class="banner-title">Themes</div>
                            <div class="banner-subtitle">Thi Tốt nghiệp THPT Quốc gia</div>
                        </div>
                        <div class="exam-content">
                            <div class="exam-meta-top"><span class="subject-tag">${(exam.subject || 'Toán').toUpperCase()}</span></div>
                            <div class="exam-title">${exam.name}</div>
                            <div class="exam-details-row">
                                <div><i class="fa-solid fa-clock"></i> Thời gian: <b>${exam.time || 90} phút</b></div>
                                <div><i class="fa-solid fa-layer-group"></i> Chuẩn Azota 3 phần</div>
                            </div>
                            <button class="btn-start-exam" onclick="openConfirmModal('${exam.id}', '${exam.name}', ${exam.time || 90})">Bắt đầu thi</button>
                        </div>
                    </div>
                `;
            }
        }

        function openCreateExamModal() { document.getElementById('create-exam-modal').style.display = 'flex'; }
        function closeCreateExamModal() { document.getElementById('create-exam-modal').style.display = 'none'; }

        function saveNewExam() {
            const name = document.getElementById('new-exam-name').value.trim();
            const subject = document.getElementById('new-exam-subject').value;
            const time = parseInt(document.getElementById('new-exam-time').value) || 90;
            let driveUrl = document.getElementById('new-exam-drive').value.trim();
            const mcqRaw = document.getElementById('new-exam-mcq').value.trim();
            const shortRaw = document.getElementById('new-exam-short').value.trim();

            if (!name) { alert("Vui lòng nhập tên đề thi!"); return; }

            if (driveUrl.includes('view?usp=sharing') || driveUrl.includes('file/d/')) {
                driveUrl = driveUrl.replace(/\/view\?usp=sharing.*/, '/preview').replace(/\/edit.*/, '/preview');
            } else if (!driveUrl) {
                driveUrl = "https://drive.google.com/file/d/1_YOUR_GOOGLE_DRIVE_FILE_ID_HERE/preview";
            }

            let mcqArr = [];
            mcqRaw.toUpperCase().match(/[ABCD]/g)?.forEach(char => {
                let code = 0;
                if (char === 'B') code = 1; else if (char === 'C') code = 2; else if (char === 'D') code = 3;
                mcqArr.push(code);
            });
            if (mcqArr.length === 0) mcqArr = [0, 1, 2, 3];

            let shortArr = shortRaw ? shortRaw.split(',').map(s => s.trim()) : ["10", "20"];

            const newId = 'exam_' + Date.now();
            const newExam = {
                id: newId, name: name, subject: subject, time: time, driveUrl: driveUrl,
                mcqAnswers: mcqArr,
                trueFalseAnswers: [[true, false, true, false], [false, true, false, true]],
                shortAnswers: shortArr
            };

            let db = getStoredDatabase();
            db[newId] = newExam;
            localStorage.setItem('examDatabase', JSON.stringify(db));

            closeCreateExamModal();
            renderExamList();
            alert(`Tạo phòng thi "${name}" thành công!`);
        }

        function openConfirmModal(id, name, time) {
            selectedExamId = id;
            localStorage.setItem('activeExamId', id);
            document.getElementById('modal-exam-name').innerText = name;
            document.getElementById('modal-exam-time').innerText = time + ' phút';
            document.getElementById('confirm-modal-overlay').style.display = 'flex';
        }

        function closeConfirmModal() { document.getElementById('confirm-modal-overlay').style.display = 'none'; }
        function confirmStartExam() { window.location.href = 'phongthi.html'; }

        function filterExams(subject, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.exam-card').forEach(card => {
                if (subject === 'all' || card.getAttribute('data-subject') === subject) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        loadUserRealStats();
        renderExamList();
    </script>
</body>
</html>
